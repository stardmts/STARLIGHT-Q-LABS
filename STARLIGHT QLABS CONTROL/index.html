<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Starlight QLabs</title>
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="icon" type="image/x-icon" href="./favicon.ico">
        <link rel="manifest" href="/site.webmanifest">
        <style>
            /* body */
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121212; margin: 0; padding-top: 0px;}
            
            .control-panel { display: flex; }
            .btn {flex: 1; padding: 25px; font-size: 1.2rem; font-weight: bold; border: #ffffff; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
            .btn-go {background: #259c45;}
            .btn-go:hover {background: #1a7031}
            .btn-pause {background: #c7ae0e;}
            .btn-pause:hover {background: #96840c}
            .btn-stop {background: #a80c0c;}
            .btn-stop:hover {background: #7a0909;}

            .current-cue-box { display: flex; background: #343835; border-top: 2px solid #ffffff; border-bottom: 2px solid #ffffff; flex: 1; flex-direction: column; align-items: center; }
            .current-cue { display: flex; background: #343835; flex: 1; width: 100%; flex-direction: row; justify-content: space-around; align-items: center; }
            .cue-text { font-size: 1.5rem; text-align: center; color: #ffffff; }
            .time { font-family: monospace; font-size: 1.5rem; color: #ffffff;}

            .progress-bar-container {margin: 20px 0 10px 0; width: 90%;}
            .track-bar-bg {background: #333; width: 100%; height: 24px; border-radius: 5px; overflow: hidden; position: relative; border: 2px solid #444}
            .track-bar-fill {background: #34a623; width: 0%; height: 100%; transition: width 0.3s linear;}
            
            .all-cues-container {list-style: none; padding: 0; margin: 0;}
            .cue-item { display: flex; background: #343835; border-top: 2px solid #ffffff; border-bottom: 2px solid #ffffff; flex: 1; flex-direction: column; justify-content: space-between; align-items: center; padding: 12px 15px; padding-bottom: 8px; margin-bottom: 15px; }
            .cue-item:hover {background: #1c1f1d; border-left-color: #0077ff;}
            .cue-item.next {border-left-color: #0077ff; background: #222;}
            .cue-number {font-family: monospace; color: #ffffff; margin-right: 10px;}
            .cue-title {flex-grow: 1; color: #ffffff;}
            .cue-duration {font-family: monospace; color: #ffffff; font-size: 0.9rem;}

            header { border-bottom: 2px solid #ffffff; }
            .header-text { font: 'segoe UI'; font-size: xx-large; text-align: center; color: #ffffff; }
            .all-cues-header-text { font: 'segoe UI'; font-size: x-large; text-align: center; color: #ffffff; }
        </style>
    </head>
    <body>
        <header class = "header">
            <h1 class = "header-text" id = "file-name">Starlight QLabs</h1>
        </header>
        <main>
            <div class = "control-panel">
                <button class = "btn btn-go">PLAY</button>
                <button class = "btn btn-pause">PAUSE</button>
                <button class = "btn btn-stop">STOP</button>
            </div>

            <div class = "current-cue-box">
                <div class = "current-cue">
                    <h1 id = "current-cue-title" class = "cue-text">No Track Playing</h1>
                    <div id = "current-cue-time" class = "time"> 00:00:00 / 00:00:00 </div>
                </div>
                <div class = "progress-bar-container">
                    <div class = "track-bar-bg">
                        <div class = "track-bar-fill" id = "progress-fill"></div>
                    </div>
                </div>
            </div>

            <div class = "all-cues-container">
                <h2 class = "all-cues-header-text">All Tracks (Control needs to be able to see all tracks so they can go to any tracks including the one playing, not just the one after the current cue) (VIEWER just needs current and all after, no need for previous / all) </h2>
                <ul id = "upcoming-cues-list" class = "all-cues-list">

                </ul>
            </div>
            
        </main>
        <script>
            /*calls here*/
        </script>
    </body>
</html>
